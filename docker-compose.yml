services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matrix_game}
      POSTGRES_USER: ${POSTGRES_USER:-matrix_game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-esto-en-produccion}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matrix_game}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://matrix_game:cambiar-esto-en-produccion@postgres:5432/matrix_game}
      JWT_SECRET: ${JWT_SECRET:-cambiar-esto-en-produccion}
      FLASK_HOST: ${FLASK_HOST:-0.0.0.0}
      FLASK_PORT: ${FLASK_PORT:-5000}
      # Matrix Vision (modulo celebracion)
      FACE_LANDMARKER_MODEL: /app/modulos/celebracion/modelos/face_landmarker.task
      MATRIX_CELL_WIDTH: ${MATRIX_CELL_WIDTH:-6}
      MATRIX_CELL_HEIGHT: ${MATRIX_CELL_HEIGHT:-8}
      MATRIX_BLACK_THRESHOLD: ${MATRIX_BLACK_THRESHOLD:-5}
      MATRIX_FONT_SCALE: ${MATRIX_FONT_SCALE:-0.32}
      MATRIX_JPEG_QUALITY: ${MATRIX_JPEG_QUALITY:-80}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    # volumes:  # descomentar para desarrollo con hot-reload
    #   - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
