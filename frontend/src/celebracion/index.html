<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Matrix Game — Celebración</title>
  <style>
    body {
      background: #000; color: #35e05a; font-family: 'Courier New', monospace;
      padding: 2rem; max-width: 420px; margin: 0 auto; text-align: center;
    }
    h1 { text-transform: uppercase; letter-spacing: 1px; }
    video, canvas { width: 100%; border: 1px solid #1f4d2c; margin-top: 1rem; }
    button {
      display: block; width: 100%; margin-top: .75rem; padding: .75rem;
      font-family: inherit; font-size: 1rem; background: #123018; color: #7dffb0;
      border: 1px solid #35e05a; cursor: pointer;
    }
    button:hover { background: #1c4a26; }
    #mensaje { min-height: 1.2em; color: #e9c46a; }
  </style>
</head>
<body>
  <h1>¡Ganaste! Eres El Elegido</h1>
  <p id="tiempo"></p>

  <video id="video" autoplay playsinline></video>
  <canvas id="foto" style="display:none;"></canvas>

  <button id="btn-capturar">Sacar selfie</button>
  <button id="btn-compartir" style="display:none;">Compartir con amigos</button>
  <button id="btn-dashboard">Volver al dashboard</button>
  <button id="btn-logout">Cerrar sesión</button>
  <p id="mensaje"></p>

  <script src="../comun.js"></script>
  <script>
    const sesion = obtenerSesion();
    if (!sesion) {
      location.href = "../autenticacion/index.html";
    }

    const tiempo = sessionStorage.getItem("matrix_game_tiempo");
    if (tiempo) {
      document.getElementById("tiempo").textContent = `Tiempo: ${parseFloat(tiempo).toFixed(1)}s`;
    }

    const video = document.getElementById("video");
    const canvas = document.getElementById("foto");
    const mensaje = document.getElementById("mensaje");
    let blobActual = null;

    navigator.mediaDevices.getUserMedia({ video: true })
      .then((stream) => { video.srcObject = stream; })
      .catch(() => { mensaje.textContent = "No se pudo acceder a la cámara."; });

    document.getElementById("btn-capturar").addEventListener("click", () => {
      canvas.width = video.videoWidth || 400;
      canvas.height = video.videoHeight || 300;
      const contexto = canvas.getContext("2d");
      contexto.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Filtro estilo Matrix: escala de verdes + scanlines + texto.
      const imagen = contexto.getImageData(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < imagen.data.length; i += 4) {
        const gris = (imagen.data[i] + imagen.data[i + 1] + imagen.data[i + 2]) / 3;
        imagen.data[i] = gris * 0.2;
        imagen.data[i + 1] = Math.min(255, gris * 1.3);
        imagen.data[i + 2] = gris * 0.2;
      }
      contexto.putImageData(imagen, 0, 0);

      for (let y = 0; y < canvas.height; y += 3) {
        contexto.fillStyle = "rgba(0,0,0,0.15)";
        contexto.fillRect(0, y, canvas.width, 1);
      }

      contexto.fillStyle = "#0f0";
      contexto.font = `${Math.floor(canvas.width / 14)}px monospace`;
      contexto.textAlign = "center";
      contexto.fillText("ERES EL ELEGIDO", canvas.width / 2, canvas.height - 16);

      video.style.display = "none";
      canvas.style.display = "block";
      document.getElementById("btn-compartir").style.display = "block";

      canvas.toBlob((blob) => {
        blobActual = blob;
        subirFoto(blob);
      }, "image/png");
    });

    async function subirFoto(blob) {
      const lector = new FileReader();
      lector.onloadend = async () => {
        try {
          const respuesta = await fetch(`${API_BASE}/celebracion/foto`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${sesion.token}`,
            },
            body: JSON.stringify({ imagen: lector.result }),
          });
          const datos = await respuesta.json();
          mensaje.textContent = datos.ok ? "Foto guardada." : (datos.error || "No se pudo guardar la foto.");
        } catch (error) {
          mensaje.textContent = "No se pudo guardar la foto (¿backend caído?).";
        }
      };
      lector.readAsDataURL(blob);
    }

    document.getElementById("btn-compartir").addEventListener("click", async () => {
      if (!blobActual) return;
      const archivo = new File([blobActual], "matrix.png", { type: "image/png" });

      if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
        try {
          await navigator.share({
            files: [archivo],
            title: "Matrix Game",
            text: "¡Soy El Elegido!",
          });
          return;
        } catch (error) {
          // el usuario canceló el share -- no hacemos nada más
          return;
        }
      }

      // Respaldo si el navegador no soporta Web Share con archivos.
      const enlace = document.createElement("a");
      enlace.href = URL.createObjectURL(blobActual);
      enlace.download = "matrix.png";
      enlace.click();
    });

    document.getElementById("btn-dashboard").addEventListener("click", () => {
      location.href = "../dashboard/index.html";
    });

    document.getElementById("btn-logout").addEventListener("click", async () => {
      try {
        await fetch(`${API_BASE}/auth/logout`, {
          method: "POST",
          headers: { Authorization: `Bearer ${sesion.token}` },
        });
      } catch (error) {
        // no importa si el backend no respondió
      }
      borrarSesion();
      location.href = "../autenticacion/index.html";
    });
  </script>
</body>
</html>
