<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Matrix Game — Celebración</title>

  <style>
    :root {
      color-scheme: dark;

      --green: #00ff41;
      --soft: #7dffb0;
      --panel: rgba(0, 15, 5, 0.88);
      --background: #000;
      --warning: #e9c46a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px;

      color: var(--green);
      background:
        radial-gradient(
          circle at center,
          #06220e 0,
          #010503 52%,
          #000 100%
        );

      font-family: "Courier New", monospace;
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
      text-align: center;
    }

    header {
      display: block;
      margin-bottom: 20px;
    }

    h1 {
      max-width: 680px;
      margin: 0 auto;

      text-transform: uppercase;
      font-size: clamp(1.8rem, 5vw, 3rem);
      line-height: 1.05;

      text-shadow:
        0 0 8px var(--green),
        0 0 20px rgba(0, 255, 65, 0.45);
    }

    #tiempo {
      margin: 14px 0 0;
      color: var(--soft);
      font-size: 1rem;
    }

    #estado {
      display: inline-block;

      margin-top: 14px;
      padding: 0.65rem 1rem;

      border: 1px solid var(--green);
      color: var(--warning);
      background: var(--panel);

      font-size: 0.85rem;
      letter-spacing: 0.08em;
    }

    .camera-section {
      display: flex;
      justify-content: center;
      width: 100%;
      margin-top: 18px;
    }

    .visor {
      position: relative;
      overflow: hidden;

      width: min(100%, 640px);
      aspect-ratio: 4 / 3;

      border: 1px solid var(--green);
      background: #000;

      box-shadow:
        0 0 16px rgba(0, 255, 65, 0.28),
        inset 0 0 28px rgba(0, 255, 65, 0.08);
    }

    #video,
    #captura-entrada {
      display: none;
    }

    #salida {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
      object-position: center;

      background: #000;
    }

    .overlay {
      position: absolute;
      left: 14px;
      right: 14px;

      display: flex;
      justify-content: space-between;
      gap: 12px;

      color: var(--green);

      font-size: 0.68rem;
      letter-spacing: 0.06em;

      pointer-events: none;

      text-shadow:
        0 0 7px rgba(0, 255, 65, 0.95);
    }

    .overlay.arriba {
      top: 12px;
    }

    .overlay.abajo {
      bottom: 12px;
    }

    .acciones {
      display: flex;
      flex-direction: column;
      gap: 12px;

      width: min(100%, 640px);
      margin: 16px auto 0;
    }

    button {
      width: 100%;
      min-height: 46px;
      padding: 0.8rem 1rem;

      border: 1px solid var(--green);
      color: var(--soft);
      background: var(--panel);

      font: inherit;
      cursor: pointer;

      transition:
        background 160ms ease,
        box-shadow 160ms ease,
        opacity 160ms ease;
    }

    button:hover:not(:disabled) {
      background: rgba(0, 55, 16, 0.88);
      box-shadow:
        0 0 12px rgba(0, 255, 65, 0.22);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #mensaje {
      min-height: 1.4em;
      margin: 14px 0 0;

      color: var(--warning);
      text-align: center;
    }

    .nota-compartir {
      margin: 6px 0 0;
      font-size: 0.72rem;
      color: var(--soft);
      opacity: 0.75;
    }

    .redes {
      margin-top: 4px;
    }

    .redes-titulo {
      margin: 0 0 8px;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--soft);
    }

    .redes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .redes-grid button {
      min-height: 42px;
      font-size: 0.82rem;
    }

    @media (max-width: 700px) {
      body {
        padding: 20px 12px;
      }

      h1 {
        font-size: clamp(1.65rem, 8vw, 2.45rem);
      }

      .overlay {
        font-size: 0.58rem;
      }
    }

    .flash {
  position: absolute;
  inset: 0;

  z-index: 10;

  background: rgba(255, 255, 255, 0.98);

  opacity: 0;
  pointer-events: none;
}

.flash.activo {
  animation: flash-camara 420ms ease-out;
}

.captura-status {
  position: absolute;
  left: 50%;
  top: 50%;

  z-index: 11;

  transform: translate(-50%, -50%) scale(0.92);

  padding: 12px 18px;

  border: 1px solid var(--green);

  color: var(--green);
  background: rgba(0, 10, 3, 0.86);

  font-size: 0.95rem;
  letter-spacing: 0.12em;

  opacity: 0;
  pointer-events: none;

  text-shadow:
    0 0 8px var(--green);

  box-shadow:
    0 0 18px rgba(0, 255, 65, 0.28);
}

.captura-status.activo {
  animation: captura-completada 1.25s ease;
}

@keyframes flash-camara {
  0% {
    opacity: 0;
  }

  12% {
    opacity: 1;
  }

  35% {
    opacity: 0.9;
  }

  100% {
    opacity: 0;
  }
}

@keyframes captura-completada {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.88);
  }

  18% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  72% {
    opacity: 1;
  }

  100% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(1.04);
  }
}
  </style>
</head>

<body>
<main>
  <header>
    <h1>
      ¡Ganaste! Eres El Elegido
    </h1>

    <p id="tiempo"></p>

    <div id="estado">
      INICIALIZANDO
    </div>
  </header>

  <section class="camera-section">
    <div class="visor">
      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <canvas id="captura-entrada"></canvas>

      <img
        id="salida"
        alt="Cámara procesada con efecto Matrix"
      >

      <div id="flash" class="flash"></div>

      <div id="captura-status" class="captura-status">
        CAPTURA COMPLETADA
      </div>

      <div class="overlay arriba">
        <span>MATRIX VISION</span>
        <span id="fps">FPS 0</span>
      </div>

      <div class="overlay abajo">
        <span id="sujeto">BUSCANDO OBJETIVO</span>
        <span>PROTOCOLO DE CELEBRACION</span>
      </div>
    </div>
  </section>

  <section class="acciones">
    <button
      id="btn-capturar"
      type="button"
      disabled
    >
      Tomar foto
    </button>

    <button
      id="btn-compartir"
      type="button"
      disabled
    >
      Compartir
    </button>
    <p class="nota-compartir">
      En el celular, "Compartir" te deja elegir Instagram, TikTok o
      cualquier app instalada, con la foto real adjunta.
    </p>

    <div class="redes" id="redes-sociales">
      <p class="redes-titulo">O compartir directo en:</p>
      <div class="redes-grid">
        <button id="btn-whatsapp" type="button" disabled>WhatsApp</button>
        <button id="btn-facebook" type="button" disabled>Facebook</button>
        <button id="btn-x" type="button" disabled>X</button>
      </div>
    </div>

    <button
      id="btn-dashboard"
      type="button"
    >
      Volver al dashboard
    </button>

    <button
      id="btn-logout"
      type="button"
    >
      Cerrar sesión
    </button>
  </section>

  <p id="mensaje"></p>
</main>

<script src="../config.js"></script>
<script src="../comun.js"></script>
<script src="/vendor/socket.io/socket.io.min.js"></script>

<script>
  const sesion = obtenerSesion();

  if (!sesion) {
    location.href = "../autenticacion/index.html";
  }

  const tiempo = sessionStorage.getItem(
    "matrix_game_tiempo"
  );

  if (tiempo) {
    document.getElementById(
      "tiempo"
    ).textContent = (
      `Tiempo: ${parseFloat(tiempo).toFixed(1)}s`
    );
  }

  const video = document.getElementById("video");
  const canvasEntrada = document.getElementById(
    "captura-entrada"
  );

  const ctxEntrada = canvasEntrada.getContext(
    "2d",
    {
      alpha: false,
    }
  );

  const salida = document.getElementById("salida");
  const estado = document.getElementById("estado");
  const mensaje = document.getElementById("mensaje");
  const fpsEl = document.getElementById("fps");

  const sujetoEl = document.getElementById(
    "sujeto"
  );

  const btnCapturar = document.getElementById(
    "btn-capturar"
  );

  const btnCompartir = document.getElementById(
    "btn-compartir"
  );

  const btnWhatsapp = document.getElementById("btn-whatsapp");
  const btnFacebook = document.getElementById("btn-facebook");
  const btnX = document.getElementById("btn-x");

  /*
   * 4:3 para que el rostro ocupe mejor el cuadro
   * y conserve una proporción similar al diseño original.
   */
  const FRAME_WIDTH = 800;
  const FRAME_HEIGHT = 600;

  /*
   * Aproximadamente 8 FPS.
   * Evita saturar Python y Socket.IO.
   */
  const FRAME_INTERVAL = 140;

  let stream = null;
  let socket = null;
  let timer = null;
  let procesando = false;

  let urlActual = null;
  let blobActual = null;
  let urlFotoPublica = null;

  let frames = 0;
  let inicioFps = performance.now();


  function ponerEstado(
    texto,
    ok = false
  ) {
    estado.textContent = texto;

    estado.style.color = (
      ok
        ? "#00ff41"
        : "#e9c46a"
    );
  }


  async function iniciar() {
    try {
      ponerEstado(
        "SOLICITANDO CÁMARA"
      );

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          width: {
            ideal: 1280,
          },
          height: {
            ideal: 960,
          },
          aspectRatio: {
            ideal: 4 / 3,
          },
          facingMode: "user",
        },
        audio: false,
      });

      video.srcObject = stream;

      await video.play();

      canvasEntrada.width = FRAME_WIDTH;
      canvasEntrada.height = FRAME_HEIGHT;

      conectarSocket();

    } catch (error) {
      console.error(error);

      ponerEstado(
        "CAMERA ERROR"
      );

      mensaje.textContent = (
        "No se pudo acceder a la cámara. "
        + "Revisa los permisos del navegador."
      );
    }
  }


  function conectarSocket() {
    socket = io(
      `${API_BASE}/celebracion-matrix`,
      {
        auth: {
          token: sesion.token,
        },
        transports: [
          "websocket",
        ],
      }
    );

    socket.on(
      "connect",
      () => {
        ponerEstado(
          "SYSTEM ONLINE",
          true
        );

        btnCapturar.disabled = false;

        timer = setInterval(
          enviarFrame,
          FRAME_INTERVAL
        );
      }
    );

    socket.on(
      "matrix_estado",
      datos => {
        if (datos?.mensaje) {
          mensaje.textContent = datos.mensaje;
        }
      }
    );

    socket.on(
      "matrix_resultado",
      datos => {
        const blob = new Blob(
          [datos],
          {
            type: "image/jpeg",
          }
        );

        if (urlActual) {
          URL.revokeObjectURL(
            urlActual
          );
        }

        urlActual = URL.createObjectURL(
          blob
        );

        salida.src = urlActual;
        blobActual = blob;
        procesando = false;

        sujetoEl.textContent = (
          "OBJETIVO DETECTADO"
        );

        actualizarFps();
      }
    );

    socket.on(
      "matrix_error",
      datos => {
        procesando = false;

        mensaje.textContent = (
          datos?.error
          || "Error procesando la imagen."
        );

        ponerEstado(
          "PROCESSING ERROR"
        );
      }
    );

    socket.on(
      "disconnect",
      () => {
        procesando = false;

        ponerEstado(
          "DESCONECTADO"
        );
      }
    );
  }


  function enviarFrame() {
    if (
      procesando
      || !socket?.connected
      || video.readyState < 2
    ) {
      return;
    }

    procesando = true;

    ctxEntrada.save();

    ctxEntrada.translate(
      FRAME_WIDTH,
      0
    );

    ctxEntrada.scale(
      -1,
      1
    );

    /*
     * Recorte central tipo cover.
     * Evita deformar la cámara al convertirla a 4:3.
     */
    const videoWidth = video.videoWidth;
    const videoHeight = video.videoHeight;

    const targetRatio = (
      FRAME_WIDTH / FRAME_HEIGHT
    );

    const videoRatio = (
      videoWidth / videoHeight
    );

    let sourceX = 0;
    let sourceY = 0;
    let sourceWidth = videoWidth;
    let sourceHeight = videoHeight;

    if (videoRatio > targetRatio) {
      sourceWidth = (
        videoHeight * targetRatio
      );

      sourceX = (
        (videoWidth - sourceWidth) / 2
      );
    } else {
      sourceHeight = (
        videoWidth / targetRatio
      );

      sourceY = (
        (videoHeight - sourceHeight) / 2
      );
    }

    ctxEntrada.drawImage(
      video,
      sourceX,
      sourceY,
      sourceWidth,
      sourceHeight,
      0,
      0,
      FRAME_WIDTH,
      FRAME_HEIGHT
    );

    ctxEntrada.restore();

    canvasEntrada.toBlob(
      async blob => {
        if (
          !blob
          || !socket?.connected
        ) {
          procesando = false;
          return;
        }

        socket.emit(
          "matrix_frame",
          await blob.arrayBuffer()
        );
      },
      "image/jpeg",
      0.90
    );
  }


  function actualizarFps() {
    frames += 1;

    const ahora = performance.now();

    const delta = (
      ahora - inicioFps
    );

    if (delta >= 1000) {
      fpsEl.textContent = (
        `FPS ${Math.round(
          frames * 1000 / delta
        )}`
      );

      frames = 0;
      inicioFps = ahora;
    }
  }

  /*
   * Apaga la camara/socket/timer de verdad -- antes, al "Tomar foto" solo
   * se subia el frame actual pero el streaming en vivo seguia corriendo
   * para siempre (nunca se llamaba esto salvo al cerrar la pestaña), asi
   * que la vista nunca se quedaba congelada en la foto capturada.
   */
  function detenerCamara() {
    if (timer) {
      clearInterval(timer);
      timer = null;
    }

    if (socket) {
      socket.disconnect();
      socket = null;
    }

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }
  }

  function ejecutarDestello() {
  flash.classList.remove("activo");
  capturaStatus.classList.remove("activo");

  /*
   * Fuerza al navegador a reiniciar la animación.
   */
  void flash.offsetWidth;
  void capturaStatus.offsetWidth;

  flash.classList.add("activo");
  capturaStatus.classList.add("activo");

  window.setTimeout(
    () => {
      flash.classList.remove("activo");
      capturaStatus.classList.remove("activo");
    },
    1300
  );
}


  btnCapturar.addEventListener(
  "click",
  async () => {
    if (!blobActual) {
      return;
    }

    btnCapturar.disabled = true;

    ejecutarDestello();

    /*
     * Espera un instante para que el flash se perciba
     * antes de guardar la fotografía.
     */
    await new Promise(
      resolve => window.setTimeout(resolve, 180)
    );

    // Se apaga la camara/socket aca: la vista queda congelada en el ultimo
    // frame recibido (que es exactamente blobActual, el que se sube abajo)
    // en vez de seguir procesando video en vivo despues de "capturar".
    detenerCamara();
    ponerEstado("CAPTURA GUARDADA", true);
    sujetoEl.textContent = "SESIÓN FINALIZADA";

    btnCompartir.disabled = false;

    await subirFoto(
      blobActual
    );
  }
);


  async function subirFoto(blob) {
    const lector = new FileReader();

    lector.onloadend = async () => {
      try {
        const respuesta = await fetch(
          `${API_BASE}/celebracion/foto`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: (
                `Bearer ${sesion.token}`
              ),
            },
            body: JSON.stringify({
              imagen: lector.result,
            }),
          }
        );

        const datos = await respuesta.json();

        mensaje.textContent = (
          datos.ok
            ? ""
            : (
              datos.error
              || "No se pudo guardar la foto."
            )
        );

        if (datos.ok && datos.url) {
          urlFotoPublica = `${API_BASE}${datos.url}`;
          habilitarBotonesDeRedes();
        }

      } catch (error) {
        console.error(error);

        mensaje.textContent = (
          "No se pudo guardar la foto."
        );
      }
    };

    lector.readAsDataURL(blob);
  }

  const flash = document.getElementById("flash");

const capturaStatus = document.getElementById(
  "captura-status"
);


  btnCompartir.addEventListener(
    "click",
    async () => {
      if (!blobActual) {
        return;
      }

      const archivo = new File(
        [blobActual],
        "matrix-vision.jpg",
        {
          type: "image/jpeg",
        }
      );

      if (
        navigator.canShare?.({
          files: [archivo],
        })
      ) {
        try {
          await navigator.share({
            files: [archivo],
            title: "Matrix Game",
            text: "¡Soy El Elegido!",
          });

          return;

        } catch (_) {
          return;
        }
      }

      const url = URL.createObjectURL(
        blobActual
      );

      const enlace = document.createElement(
        "a"
      );

      enlace.href = url;
      enlace.download = "matrix-vision.jpg";

      document.body.appendChild(
        enlace
      );

      enlace.click();
      enlace.remove();

      setTimeout(
        () => URL.revokeObjectURL(url),
        1000
      );
    }
  );


  /*
   * Mensaje compartido por los 3 botones de redes -- incluye el tiempo
   * (puntaje) para que quede claro en el texto, no solo en la foto.
   */
  function mensajeCompartir() {
    const sufijoTiempo = tiempo
      ? ` en ${parseFloat(tiempo).toFixed(1)}s`
      : "";

    return `¡Soy El Elegido en Matrix Game! Escapé del laberinto${sufijoTiempo} 💚`;
  }

  function habilitarBotonesDeRedes() {
    btnWhatsapp.disabled = false;
    btnFacebook.disabled = false;
    btnX.disabled = false;
  }

  /*
   * WhatsApp/Facebook/X no tienen forma de recibir el archivo de imagen
   * directo via un link de "compartir" (a diferencia de la Web Share API
   * de arriba) -- comparten texto + una URL. Como la foto ya quedo
   * guardada en el backend con una URL publica (GET /celebracion/fotos/..,
   * sin autenticacion), se linkea esa foto real en el mensaje.
   */
  btnWhatsapp.addEventListener("click", () => {
    if (!urlFotoPublica) return;
    const texto = `${mensajeCompartir()} ${urlFotoPublica}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, "_blank");
  });

  btnFacebook.addEventListener("click", () => {
    if (!urlFotoPublica) return;
    const parametros = new URLSearchParams({
      u: urlFotoPublica,
      quote: mensajeCompartir(),
    });
    window.open(
      `https://www.facebook.com/sharer/sharer.php?${parametros}`,
      "_blank",
      "width=600,height=520"
    );
  });

  btnX.addEventListener("click", () => {
    if (!urlFotoPublica) return;
    const parametros = new URLSearchParams({
      text: mensajeCompartir(),
      url: urlFotoPublica,
    });
    window.open(
      `https://twitter.com/intent/tweet?${parametros}`,
      "_blank",
      "width=600,height=520"
    );
  });

  document.getElementById(
    "btn-dashboard"
  ).onclick = () => {
    location.href = "../dashboard/index.html";
  };


  document.getElementById(
    "btn-logout"
  ).onclick = async () => {
    try {
      await fetch(
        `${API_BASE}/auth/logout`,
        {
          method: "POST",
          headers: {
            Authorization: (
              `Bearer ${sesion.token}`
            ),
          },
        }
      );
    } catch (_) {
      // El cierre local continúa aunque falle el backend.
    }

    borrarSesion();

    location.href = (
      "../autenticacion/index.html"
    );
  };


  window.addEventListener(
    "beforeunload",
    () => {
      detenerCamara();

      if (urlActual) {
        URL.revokeObjectURL(
          urlActual
        );
      }
    }
  );


  iniciar();
</script>
</body>
</html>
