<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Matrix Game — Autenticación</title>
  <style>
    body {
      background: #05070a; color: #35e05a; font-family: 'Courier New', monospace;
      padding: 2rem; max-width: 420px; margin: 0 auto;
    }
    h1 { text-transform: uppercase; letter-spacing: 2px; }
    input, button {
      display: block; width: 100%; margin-bottom: .75rem; padding: .6rem;
      font-family: inherit; font-size: 1rem; box-sizing: border-box;
    }
    button { background: #123018; color: #7dffb0; border: 1px solid #35e05a; cursor: pointer; }
    button:hover { background: #1c4a26; }
    #mensaje { color: #ff6b6b; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Matrix Game</h1>
  <p>Iniciá sesión o creá una cuenta para jugar.</p>

  <form id="form-auth">
    <input type="email" id="email" placeholder="email" required>
    <input type="password" id="password" placeholder="contraseña (mínimo 4 caracteres)" required minlength="4">
    <button type="submit">Iniciar sesión</button>
    <button type="button" id="btn-registro">Crear cuenta</button>
  </form>
  <p id="mensaje"></p>

  <script src="../comun.js"></script>
  <script>
    const form = document.getElementById("form-auth");
    const mensaje = document.getElementById("mensaje");

    async function autenticar(ruta) {
      mensaje.textContent = "";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      let respuesta;
      try {
        respuesta = await fetch(`${API_BASE}${ruta}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
      } catch (error) {
        mensaje.textContent = "No se pudo conectar con el backend.";
        return;
      }

      const datos = await respuesta.json();
      if (!respuesta.ok || !datos.ok) {
        mensaje.textContent = datos.error || "Error desconocido.";
        return;
      }

      guardarSesion({ token: datos.token, usuario: datos.usuario });
      location.href = "../dashboard/index.html";
    }

    form.addEventListener("submit", (evento) => {
      evento.preventDefault();
      autenticar("/auth/login");
    });

    document.getElementById("btn-registro").addEventListener("click", () => {
      autenticar("/auth/registro");
    });
  </script>
</body>
</html>
